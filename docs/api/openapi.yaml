openapi: 3.1.0
info:
  title: API de contacto del portafolio
  version: 1.0.0
  description: >-
    Contrato observado del endpoint de contacto existente, conforme a la
    arquitectura v1.0 (ARCHITECTURE.md, §§3, 4, 8, 9 y 14) y al payload de
    frontend definido por ADR-0004. Distingue el DTO que acepta backend del
    payload reducido que envía el frontend.

servers:
  - url: "{apiBaseUrl}"
    description: >-
      Base URL del backend. En desarrollo local, apiBaseUrl vale
      http://localhost:8080. El frontend incorpora el host desde
      NEXT_PUBLIC_API_BASE_URL.
    variables:
      apiBaseUrl:
        default: "http://localhost:8080"
        description: URL base del backend, inyectada en el frontend mediante NEXT_PUBLIC_API_BASE_URL.

paths:
  /api/v1/contactos:
    post:
      operationId: createContacto
      summary: Crear un contacto
      description: >-
        Recibe el formulario de contacto enviado desde el frontend estático y
        crea un registro mediante el backend existente. ContactoDTO requiere
        nombre, email y mensaje; asunto es opcional. El frontend envía solo
        nombre, email y mensaje conforme a ADR-0004. HoneypotField y Locale son
        exclusivamente del cliente y no viajan en el payload. La implementación
        actual de ContactoController permite cualquier origen con @CrossOrigin("*");
        la allowlist FRONTEND_ORIGIN prevista por ADR-0004 aún no está aplicada.
        No se observan límites de longitud, autenticación ni protección anti-spam
        del lado del servidor en el código revisado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactoRequest"
            example:
              nombre: Alex Ejemplo
              email: alex@example.test
              mensaje: Hola, me gustaría ponerme en contacto.
      responses:
        "201":
          description: Contacto creado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactoCreatedResponse"
              example:
                id: 1
                nombre: Alex Ejemplo
                email: alex@example.test
                asunto: null
                mensaje: Hola, me gustaría ponerme en contacto.
                fechaRegistro: "2026-11-19T12:30:00"
        "400":
          description: >-
            Bad Request por JSON mal formado o por validación Bean Validation
            de ContactoDTO (@NotBlank o @Email). @NotBlank rechaza valores nulos,
            vacíos o compuestos solo por espacios; @Email aplica la validación
            de formato de Jakarta Bean Validation. No hay @ControllerAdvice
            personalizado; Spring Boot genera el cuerpo de error predeterminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpringDefaultErrorResponse"
              example:
                timestamp: "2026-01-01T00:00:00Z"
                status: 400
                error: Bad Request
                path: /api/v1/contactos
        "415":
          description: >-
            Unsupported Media Type cuando el Content-Type no es compatible con
            application/json. El cuerpo lo genera el manejo predeterminado de
            Spring Boot; no hay un sobre de error personalizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpringDefaultErrorResponse"
              example:
                timestamp: "2026-01-01T00:00:00Z"
                status: 415
                error: Unsupported Media Type
                path: /api/v1/contactos
        "500":
          description: >-
            Internal Server Error por un error inesperado de persistencia o del
            servidor. backend/ no define un @ControllerAdvice personalizado;
            el cuerpo representa la estructura de error estándar de Spring Boot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpringDefaultErrorResponse"
              example:
                timestamp: "2026-01-01T00:00:00Z"
                status: 500
                error: Internal Server Error
                path: /api/v1/contactos

components:
  schemas:
    ContactoRequest:
      type: object
      description: >-
        Representa el DTO de entrada ContactoDTO. El servidor acepta asunto como
        opcional, pero el frontend lo omite conforme a ADR-0004. HoneypotField
        y Locale son exclusivamente del cliente y no forman parte del payload.
        El código no declara longitudes máximas para estos campos.
      required:
        - nombre
        - email
        - mensaje
      properties:
        nombre:
          type: string
          minLength: 1
          description: >-
            Nombre de contacto. ContactoDTO aplica @NotBlank, que también
            rechaza cadenas compuestas solo por espacios; no hay longitud
            máxima declarada en el DTO.
        email:
          type: string
          format: email
          minLength: 1
          description: >-
            Correo de contacto. ContactoDTO aplica @NotBlank y @Email; no hay
            longitud máxima declarada en el DTO.
        asunto:
          type:
            - string
            - "null"
          description: >-
            Campo opcional sin restricciones Bean Validation en ContactoDTO.
            ADR-0004 indica que el frontend lo omite.
        mensaje:
          type: string
          minLength: 1
          description: >-
            Mensaje de contacto. ContactoDTO aplica @NotBlank, que también
            rechaza cadenas compuestas solo por espacios; no hay longitud
            máxima declarada en el DTO.

    ContactoCreatedResponse:
      type: object
      description: Entidad Contacto persistida y devuelta por el backend.
      required:
        - id
        - nombre
        - email
        - asunto
        - mensaje
        - fechaRegistro
      properties:
        id:
          type: integer
          format: int64
          description: Identificador generado por la persistencia.
        nombre:
          type: string
        email:
          type: string
          format: email
        asunto:
          type:
            - string
            - "null"
          description: >-
            Campo nullable de la entidad devuelta. Si el request omite asunto,
            ContactoServiceImpl lo deja null.
        mensaje:
          type: string
        fechaRegistro:
          type: string
          format: local-date-time
          description: >-
            LocalDateTime asignado en @PrePersist y serializado como fecha y
            hora ISO-8601 sin zona horaria ni offset.

    SpringDefaultErrorResponse:
      type: object
      description: >-
        Estructura estándar de error de Spring Boot. backend/ no define un
        @ControllerAdvice personalizado para transformar estas respuestas.
      required:
        - timestamp
        - status
        - error
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          description: Instante en que se produjo el error.
        status:
          type: integer
          description: Código HTTP de error.
        error:
          type: string
          description: Motivo HTTP del error.
        path:
          type: string
          description: Ruta de la solicitud que produjo el error.
