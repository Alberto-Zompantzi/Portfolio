name: Solicitud de funcionalidad
description: Proponer una funcionalidad o mejora del portafolio
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: ¿Qué necesidad de usuario o producto resuelve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Alcance
      description: Indica explícitamente qué SÍ y qué NO incluye.
      placeholder: "SÍ: ...\nNO: ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación (Gherkin)
      placeholder: "Dado ...\nCuando ...\nEntonces ..."
    validations:
      required: true
  - type: textarea
    id: documents
    attributes:
      label: Documentos a leer
      description: Lista las rutas de documentos que deben consultarse.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencias
      description: Issues, decisiones, servicios o bloqueos relacionados; escribe Ninguna si no aplica.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Frontend
        - Backend
        - Infra/Docs
    validations:
      required: true
