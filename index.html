    <!-- Critical inline CSS to prevent FOUC -->
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0f0f10;
      }
      #root {
        min-height: 100vh;
      }
      .bootloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background-color: #0f0f10;
        color: #ffffff;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        z-index: 9999;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
      }
      .bootloader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .bootloader__brand {
        font-family:
          "Space Grotesk",
          -apple-system,
          sans-serif;
        font-weight: 700;
        font-size: 1.25rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .bootloader__brand span {
        color: hsl(265, 85%, 62%);
      }
      .bootloader__spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: hsl(265, 85%, 62%);
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .bootloader__text {
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.65;
      }
      @media (prefers-reduced-motion: reduce) {
        .bootloader__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="bootloader" class="bootloader" role="status" aria-live="polite">
        <div class="bootloader__brand">A.Z.<span>Developer</span></div>
        <div class="bootloader__spinner" aria-hidden="true"></div>
        <div class="bootloader__text">
          Booting portfolio — reproducible, documented, hardened.
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide bootloader when React hydrates
      window.addEventListener("load", function () {
        setTimeout(function () {
          var b = document.getElementById("bootloader");
          if (b) {
            b.classList.add("hidden");
          }
        }, 250);
      });
    </script>
  </body>
